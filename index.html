<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>KI-ORAKEL</title><style>
:root{--ink:#101010;--paper:#f4f1e9;--white:#fff;--lime:#d7ff3f;--pink:#ff5b75;--cyan:#64d8d4;--violet:#b8a0ff;--gray:#767676;--line:#c9c6bd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}button{font:inherit}.app{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}.screen{width:min(720px,100%);min-height:min(760px,calc(100svh - 32px));background:var(--paper);padding:clamp(24px,6vw,48px);position:relative;display:flex;flex-direction:column;justify-content:center;box-shadow:0 22px 70px #0008}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--pink);margin-bottom:18px}.number{position:absolute;top:22px;right:26px;font-size:13px;font-weight:900}.number:after{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lime);margin-left:8px}h1{font-size:clamp(43px,12vw,78px);line-height:.92;margin:0 0 22px;letter-spacing:-.04em}h2{font-size:clamp(27px,7vw,43px);line-height:1.04;margin:0 0 22px;letter-spacing:-.025em}p{font-size:clamp(16px,4.2vw,21px);line-height:1.4;margin:8px 0 20px}.small{font-size:13px;color:var(--gray)}.primary,.option,.topic{width:100%;border:2px solid var(--ink);padding:16px 17px;margin:5px 0;background:var(--white);color:var(--ink);font-weight:800;font-size:16.5px;text-align:left;cursor:pointer}.primary{background:var(--lime);text-align:center;margin-top:18px}.option:active,.topic:active,.primary:active{transform:translateY(2px)}.progress{height:9px;background:#ddd9cf;margin:0 0 28px}.progress i{display:block;height:100%;background:var(--pink);transition:width .25s}.loader{height:14px;background:#333;margin:28px 0;overflow:hidden}.loader i{display:block;height:100%;width:0;background:var(--lime);animation:load 2.8s linear forwards}@keyframes load{to{width:100%}}.halt{background:var(--pink)}.halt .eyebrow{color:var(--ink)}.final{background:var(--ink);color:var(--white)}.final .eyebrow{color:var(--pink)}.final strong{color:var(--lime)}.topic{display:block;border-left-width:12px}.topic.orange{border-left-color:var(--pink)}.topic.green{border-left-color:var(--lime)}.topic.blue{border-left-color:var(--cyan)}.topic.violet{border-left-color:var(--violet)}.topic b{display:block;font-size:19px;margin-bottom:5px}.mirror{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.mirror div{background:var(--white);border:2px solid var(--ink);padding:12px}.mirror b{display:block;font-size:25px}.mirror span{display:block;font-size:12px;color:var(--gray);margin-top:4px}.badge{display:inline-block;background:var(--lime);padding:7px 10px;font-weight:900;font-size:12px;letter-spacing:.08em;margin-bottom:14px}@media(max-height:680px){.screen{min-height:calc(100svh - 20px);padding:20px}.option,.topic{padding:11px 13px;margin:3px 0}h2{font-size:27px}p{font-size:15px}.mirror div{padding:8px}.mirror b{font-size:21px}}
</style></head><body><main class="app"><section id="screen" class="screen"></section></main><script>
const TYPES={
 try:{short:'Erst ausprobieren',title:'ERST AUSPROBIEREN',text:'In deinen vier spontanen Antworten hast du häufiger die unmittelbare Nutzung der KI gewählt. Du lässt eine neue Möglichkeit zunächst wirken und prüfst ihren Nutzen im Tun. Spannend für den weiteren Tag: Wo hilft dir dieses Ausprobieren, schneller voranzukommen und an welcher Stelle möchtest du bewusst innehalten?'},
 understand:{short:'Erst verstehen',title:'ERST VERSTEHEN',text:'In deinen vier spontanen Antworten waren dir Kriterien, Begründungen und Nachvollziehbarkeit häufiger wichtig. Bevor du einer KI-Empfehlung folgst, möchtest du eher verstehen, wie sie zustande kommt. Spannend für den weiteren Tag: Wie viel Transparenz brauchst du, damit KI für dich zu einer hilfreichen Unterstützung wird?'},
 human:{short:'Mensch zuerst',title:'MENSCH ZUERST',text:'In deinen vier spontanen Antworten hast du häufiger die menschliche Einschätzung oder eine bewusste Grenze für KI priorisiert. Besonders dort, wo Verantwortung, Beziehung oder Einordnung wichtig werden, rückst du den Menschen in den Vordergrund. Spannend für den weiteren Tag: Was sollte auch mit leistungsfähigerer KI bewusst menschlich bleiben?'},
 connect:{short:'Perspektiven verbinden',title:'PERSPEKTIVEN VERBINDEN',text:'In deinen vier spontanen Antworten hast du besonders dort angesetzt, wo menschliche Einschätzung und KI-Unterstützung zusammenkommen. Du hast nicht nur zwischen Mensch oder KI gewählt, sondern beide Perspektiven miteinander verbunden. Spannend für den weiteren Tag: Wie kann dieses Zusammenspiel gelingen, ohne Verantwortung an die Technik abzugeben?'}
};
// Jede Frage enthält exakt eine Antwort je Typ. Die Reihenfolge variiert bewusst.
const QUESTIONS=[
 {k:'MONTAGMORGEN',q:'08:03 Uhr. Die KI hat 47 Mails gelesen und drei Antworten vorbereitet. Wie reagierst du?',a:[
  {t:'try',x:'😎 Perfekt. Zeig her, ich probiere es direkt aus.'},
  {t:'understand',x:'🧐 Zeig mir zuerst deine Auswahlkriterien.'},
  {t:'human',x:'👤 Antworten sende weiterhin ich selbst.'},
  {t:'connect',x:'🔀 Zeig Vorschläge und Kriterien, dann entscheide ich.'}]},
 {k:'DIE SITZUNG',q:'Die KI meldet: „Ihr diskutiert dieses Thema zum vierten Mal. Eine Entscheidung fehlt.“',a:[
  {t:'connect',x:'🔀 Hinweis nutzen und die Entscheidung gemeinsam treffen.'},
  {t:'human',x:'👤 Danke. Die Einordnung übernimmt jetzt die Runde.'},
  {t:'try',x:'🎯 Guter Hinweis. Dann entscheiden wir jetzt.'},
  {t:'understand',x:'🧐 Woran machst du diese Aussage fest?'}]},
 {k:'FÜHRUNG',q:'Eine Person fragt: „Was würdest du an meiner Stelle tun?“ Gleichzeitig empfiehlt die KI eine Lösung.',a:[
  {t:'human',x:'👂 Zuerst nach der eigenen Einschätzung fragen.'},
  {t:'try',x:'🤖 Die KI-Empfehlung direkt als Impuls zeigen.'},
  {t:'connect',x:'🔀 Eigene Sicht, KI-Impuls und Team-Perspektive verbinden.'},
  {t:'understand',x:'🧐 Zuerst die Begründung der KI prüfen.'}]},
 {k:'DIE BESSERE IDEE',q:'Die Alternative der KI ist offensichtlich besser als deine.',a:[
  {t:'understand',x:'🔍 Erst verstehen, warum der Vorschlag besser ist.'},
  {t:'connect',x:'🧩 Die besten Elemente beider Ideen kombinieren.'},
  {t:'human',x:'👤 Den Vorschlag nutzen, die Verantwortung bleibt bei mir.'},
  {t:'try',x:'👏 Großartig. Nehmen wir und testen es.'}]}
];
const s=document.getElementById('screen');let index=0;let answers=[];
function start(){index=0;answers=[];s.className='screen';s.innerHTML='<div class="eyebrow">5-MINUTEN-EXPERIMENT</div><h1>KI-ORAKEL</h1><h2>Wer führt hier eigentlich wen?</h2><p>Vier Situationen. Vier spontane Entscheidungen. Kein Richtig. Kein Falsch.</p><button class="primary" onclick="question()">STARTEN</button><p class="small">Es werden keine Angaben gespeichert oder übertragen.</p>'}
function question(){const q=QUESTIONS[index];s.className='screen';s.innerHTML=`<div class="number">${String(index+1).padStart(2,'0')}</div><div class="progress"><i style="width:${(index+1)*25}%"></i></div><div class="eyebrow">${q.k}</div><h2>${q.q}</h2>${q.a.map((a,n)=>`<button class="option" onclick="answer(${n})">${a.x}</button>`).join('')}<p class="small">Spontan entscheiden. Nicht lange überlegen.</p>`}
function answer(n){answers.push(QUESTIONS[index].a[n].t);index++;index<QUESTIONS.length?question():analyse()}
function analyse(){s.className='screen final';s.innerHTML='<div class="eyebrow">KI ANALYSIERT DEINE ANTWORTEN …</div><h2>Ausprobieren<br>Verstehen<br>Menschliche Einordnung<br>Perspektiven verbinden</h2><div class="loader"><i></i></div><p><strong>100 %</strong></p>';setTimeout(halt,3000)}
function halt(){s.className='screen halt';s.innerHTML='<div class="eyebrow">🛑 HALT</div><h1>VIER ANTWORTEN SIND KEIN PERSÖNLICHKEITSPROFIL.</h1><p>Sie können aber einen spielerischen Spiegel deiner Reaktionen in diesen vier Situationen ergeben.</p><button class="primary" onclick="mirror()">ANTWORTSPIEGEL ANZEIGEN</button>'}
function mirror(){const scores={try:0,understand:0,human:0,connect:0};answers.forEach(t=>scores[t]++);const max=Math.max(...Object.values(scores));const winners=Object.keys(scores).filter(k=>scores[k]===max);let title,text;if(winners.length===1){({title,text}=TYPES[winners[0]])}else{title='GEMISCHTES ANTWORTBILD';text='Deine vier Antworten zeigen keinen eindeutigen Schwerpunkt. Je nach Situation hast du zwischen Ausprobieren, Verstehen, menschlicher Einordnung und dem Verbinden von Perspektiven gewechselt. Spannend für den weiteren Tag: Welche Situation entscheidet für dich darüber, wie viel Raum du einer KI gibst?'}s.className='screen';s.innerHTML=`<div class="eyebrow">DEIN PERSÖNLICHER ANTWORTSPIEGEL</div><span class="badge">SPIELERISCHE ORIENTIERUNG</span><h2>${title}</h2><p>${text}</p><div class="mirror">${Object.keys(scores).map(k=>`<div><b>${scores[k]}/4</b><span>${TYPES[k].short}</span></div>`).join('')}</div><p class="small"><b>Kein Persönlichkeits- oder Führungsprofil.</b> Der Spiegel beschreibt ausschließlich dein Antwortmuster in diesen vier Spielsituationen.</p><button class="primary" onclick="topics()">ZUR ABSCHLUSSFRAGE</button>`}
function topics(){s.className='screen';s.innerHTML='<div class="eyebrow">EINE ABSCHLUSSFRAGE</div><h2>Was verändert KI für dich am stärksten?</h2><button class="topic orange" onclick="finish(\'FÜHRUNG\')"><b>🟠 FÜHRUNG</b>Wie verändert sich meine Rolle?</button><button class="topic green" onclick="finish(\'ZUSAMMENARBEIT\')"><b>🟢 ZUSAMMENARBEIT</b>Wie verändert sich unser Miteinander?</button><button class="topic blue" onclick="finish(\'ENTSCHEIDUNGEN\')"><b>🔵 ENTSCHEIDUNGEN</b>Wann vertraue ich einer KI?</button><button class="topic violet" onclick="finish(\'MENSCHLICHKEIT\')"><b>🟣 MENSCHLICHKEIT</b>Was sollte bewusst menschlich bleiben?</button>'}
function finish(topic){s.className='screen final';s.innerHTML=`<div class="eyebrow">DEINE WAHL: ${topic}</div><h1>DANKE.</h1><p>Genau darum geht es heute.</p><h2><strong>WAS MACHT KI MIT UNS?</strong></h2><button class="primary" onclick="start()">NOCH EINMAL</button>`}start();
</script></body></html>
